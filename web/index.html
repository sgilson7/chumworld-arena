<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- M5 (online kit): connect-src also lists exactly the relays in
       the online config, which the transport reaches only after Host or
       Join by room code; online_fence.rs matches the two lists.
       Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://nos.lol wss://nostr.mom wss://relay.damus.io wss://relay.primal.net wss://nostr-01.yakihonne.com wss://nostr.sathoarder.com wss://relay.mostro.network; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Chumworld Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-screen="loading">
  <canvas id="view"></canvas>
  <div id="hurt" aria-hidden="true"></div>
  <div id="bars" aria-live="polite"></div>
  <div id="hud" aria-live="polite"></div>
  <div id="watch" hidden><p id="watch-line"></p><div id="watch-labels"></div><aside id="watch-tree" aria-live="off"></aside></div>
  <div id="overlay" hidden></div>
  <div id="loading" role="status"><span id="loading-text"></span></div>
  <p id="message" role="alert"></p>
  <p id="online-sums" hidden></p>
  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
